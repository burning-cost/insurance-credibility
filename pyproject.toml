[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-credibility"
version = "0.2.0"
description = "Credibility models for UK non-life insurance pricing: Bühlmann-Straub, Bayesian experience rating, and hierarchical GLM credibility for personal and commercial lines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Burning Cost", email = "pricing.frontier@gmail.com" }
]
keywords = [
    "actuarial",
    "credibility",
    "credibility theory",
    "buhlmann",
    "buhlmann-straub",
    "bühlmann",
    "bühlmann-straub",
    "insurance",
    "pricing",
    "empirical bayes",
    "empirical-bayes",
    "experience rating",
    "bayesian",
    "UK",
    "personal lines",
    "commercial lines",
    "non-life insurance",
    "general insurance",
    "claims experience",
    "heterogeneity",
    "random effects",
    "hierarchical model",
    "premium rating",
    "loss ratio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "polars>=1.0",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]
deep = ["torch>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=2.0",
    "scipy>=1.10",
    "polars>=1.0",
]

[project.urls]
Homepage = "https://burning-cost.github.io/libraries/insurance-credibility/"
Documentation = "https://burning-cost.github.io/libraries/insurance-credibility/"
Repository = "https://github.com/burning-cost/insurance-credibility"
"Bug Tracker" = "https://github.com/burning-cost/insurance-credibility/issues"
Changelog = "https://github.com/burning-cost/insurance-credibility/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_credibility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/insurance_credibility"]
